<!doctype html>
<html lang="en">
  <head>
    <script src="/trusted-types-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waybilla — Official Site | Digital Waybill & Motor Park Live Tracking</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Waybilla is Nigeria's #1 official digital waybill and motor park live tracking platform. Track parcels live, verify 6-digit pickup PINs, and manage commercial interstate fleet truck trips across Nigerian motor parks." />
    <meta name="keywords" content="Waybilla, Waybilla Nigeria, waybilla.com.ng, Waybilla app, waybill tracking, track waybill, motor park tracking, digital waybill, nigeria waybill, fleet tracking nigeria, interstate parcel delivery" />
    <meta name="author" content="Waybilla" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://waybilla.com.ng" />

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://waybilla.com.ng" />
    <meta property="og:title" content="Waybilla — Official Digital Waybill & Live Tracking Platform" />
    <meta property="og:description" content="Waybilla — Nigeria's #1 official digital waybill live tracking and commercial motor park platform." />
    <meta property="og:image" content="https://waybilla.com.ng/icon-512.png" />
    <meta property="og:site_name" content="Waybilla" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://waybilla.com.ng" />
    <meta name="twitter:title" content="Waybilla — Official Digital Waybill & Live Tracking Platform" />
    <meta name="twitter:description" content="Waybilla — Nigeria's #1 official digital waybill live tracking and commercial motor park platform." />
    <meta name="twitter:image" content="https://waybilla.com.ng/icon-512.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Waybilla",
      "alternateName": [
        "Waybilla Nigeria",
        "Waybilla NG",
        "Waybilla App",
        "Waybilla Tracking",
        "waybilla.com.ng"
      ],
      "url": "https://waybilla.com.ng",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://waybilla.com.ng/?track={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Waybilla",
      "legalName": "Waybilla Nigeria",
      "alternateName": ["Waybilla", "Waybilla NG", "Waybilla Nigeria"],
      "url": "https://waybilla.com.ng",
      "logo": "https://waybilla.com.ng/icon-512.png",
      "description": "Waybilla is Nigeria's #1 official digital waybill live tracking and motor park commercial fleet platform.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["en"]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Waybilla",
      "alternateName": "Waybilla Nigeria",
      "url": "https://waybilla.com.ng",
      "description": "Waybilla — Dedicated digital waybill live tracking and motor park management system.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5."
    }
    </script>

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/icon-512.png" as="image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0A1F44" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Waybilla Nigeria" />
    
    <!-- Google Translate Auto-Translation Integration -->
    <style>
      /* Hide default Google Translate banner and widget top bars for clean UI */
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
        box-shadow: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
      #google_translate_element {
        display: none !important;
      }
      /* Prevent translation on non-translatable codes like WB-890123 */
      .notranslate {
        translate: no;
      }
    </style>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
  </head>
  <body class="bg-[#0A1F44] text-slate-900 m-0 font-sans antialiased">
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
